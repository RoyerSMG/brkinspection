<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inspecciones Sedes</title>
    <link rel="shortcut icon" href="logo2.ico" type="image/x-icon">
    <script src="./js/html2canvas.min.js"></script>
    <link rel="stylesheet" href="./styles/sede.css">
</head>

<body>
    <div id="app-header"></div>

    <main>
        <div class="page-header">
            <div>
                <h2 class="page-title">Nueva Inspección de Sede</h2>
                <p class="page-sub">Central de Inteligencia y Gestión Integral de Riesgos — Brinks de Colombia</p>
            </div>
            <button class="btn-limpiar" id="btnLimpiar" type="button">↺ Limpiar todo</button>
        </div>

        <!-- Datos de la sede -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-title">Datos de la sede</div>
            <div class="field-row">
                <div class="field">
                    <label>Nombre sede</label>
                    <input type="text" id="nombreSede" placeholder="Ej: Sucursal Bogotá Norte">
                </div>
                <div class="field">
                    <label>Tipo de inspección</label>
                    <!-- Lo llena app con fillSelect(TIPOS_INSPECCION) -->
                    <select id="tipoInspeccion"></select>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Abonado</label>
                    <input type="text" id="abonado" placeholder="Ingrese el abonado">
                </div>
                <div class="field">
                    <label>Dispositivo</label>
                    <input type="text" id="dispositivo" placeholder="Ingrese el dispositivo">
                </div>
            </div>
            <div class="field-row single" style="margin-top: 4px;">
                <div class="field">
                    <label>Observación</label>
                    <textarea id="observacionSede"
                        placeholder="Ingresa cualquier novedad o comentario relevante..."></textarea>
                </div>
            </div>
        </div>

        <!-- Estructura de fotos (chips generados por TipoRutaChips) -->
        <div class="tipo-ruta-wrap estructura-wrap">
            <span class="tipo-label">Estructura de fotos</span>
            <div class="tipo-options" id="estructuraOpciones"></div>
        </div>

        <!-- Evidencia fotográfica (la renderiza FotosEditor) -->
        <div class="card" id="cardFotos" style="margin-bottom: 20px;">
            <div class="card-title">Evidencia fotográfica</div>
            <div id="fotosFormContainer" class="fotos-form-grid-3"></div>
            <button type="button" class="btn-secundario" id="btnAgregarFoto" style="margin-top:14px; display:none;">
                + Agregar foto
            </button>
        </div>

        <!-- Preview en vivo -->
        <div class="preview-section">
            <div class="preview-header">
                <span class="preview-title">Vista previa en tiempo real</span>
                <div class="preview-actions">
                    <button class="btn-copiar" id="btnCopiar" type="button">
                        <svg viewBox="0 0 24 24">
                            <rect x="9" y="9" width="13" height="13" rx="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        Copiar imagen
                    </button>
                    <button class="btn-descargar" id="btnDescargar" type="button">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Descargar PNG
                    </button>
                </div>
            </div>

            <!-- SedePreview inyecta aquí el reporte -->
            <div class="preview-wrap" id="previewHtmlSede"></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>
    <div id="app-footer"></div>

    <script type="module" src="./js/AppSede.js"></script>
</body>

</html>
