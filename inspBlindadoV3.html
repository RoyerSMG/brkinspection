<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inspecciones</title>
    <link rel="shortcut icon" href="logo2.ico" type="image/x-icon">
    <script src="./js/html2canvas.min.js"></script>
    <link rel="stylesheet" href="./styles/blindado.css">
</head>

<body>
    <div id="app-header"></div>

    <main>
        <div class="page-header">
            <div>
                <h2 class="page-title">Nueva Inspección</h2>
                <p class="page-sub">Central de Inteligencia y Gestión Integral de Riesgos — Brinks de Colombia</p>
            </div>
            <button class="btn-limpiar" id="btnLimpiar" type="button">↺ Limpiar todo</button>
        </div>

        <!-- Tipo de ruta (chips generados por TipoRutaChips) -->
        <div class="tipo-ruta-wrap">
            <span class="tipo-label">Tipo de ruta</span>
            <div class="tipo-options" id="tipoOpciones"></div>
        </div>

        <div class="card" style="margin-bottom: 10px;">
            <div class="card-title">Datos tripulación</div>
            <div class="field-row">
                <div class="field">
                    <label id="lblNameJt">Nombre Jefe de Tripulación</label>
                    <input type="text" id="name_jt" placeholder="Ingrese un nombre">
                </div>
                <div class="field">
                    <label id="lblNameConductor">Nombre Conductor</label>
                    <input type="text" id="nameConductor" placeholder="Ingrese un nombre">
                </div>
            </div>
        </div>

        <div class="grid-main">
            <div class="card">
                <div class="card-title">Datos del vehículo</div>
                <div class="field-row">
                    <div class="field">
                        <label>Placa del vehículo</label>
                        <input type="text" id="placa" placeholder="Ej: KGA804" maxlength="7">
                    </div>
                    <div class="field">
                        <label>Ciudad Origen</label>
                        <select id="ciudad"></select>
                    </div>
                </div>
                <div class="field-row single">
                    <div class="field">
                        <label>Coordenadas GPS</label>
                        <input type="text" id="coordenadas" placeholder="Ej: 6.41902, -75.72865">
                    </div>
                </div>
                <div class="field-row single" style="margin-top: 4px;">
                    <div class="field">
                        <label>Observación</label>
                        <textarea id="observacion"
                            placeholder="Ingresa cualquier novedad o comentario relevante..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Checklist: lo llena app.js con ToggleStatus + EstadoSelect -->
            <div class="card" id="cardChecklist">
                <div class="card-title">Control inspeccionado</div>
                <div class="checklist" id="checklistContainer"></div>
            </div>

            <!-- Trayectos (solo Moneda BOR) -->
            <div class="card" id="cardTrayecto">
                <div class="card-title">Trayecto</div>
                <div id="trayectosContainer"></div>
                <button type="button" class="btn-secundario" id="btnAddTrayecto" style="margin-top:10px">
                    + Agregar trayecto
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Evidencia fotográfica</div>
            <div class="imagenes-grid" id="gridEvidencias"></div>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <span class="preview-title">Vista previa en tiempo real</span>
                <div class="preview-actions">
                    <button class="btn-copiar" id="btnCopiar" type="button">
                        <svg viewBox="0 0 24 24">
                            <rect x="9" y="9" width="13" height="13" rx="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        Copiar imagen
                    </button>
                    <button class="btn-descargar" id="btnDescargar" type="button">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Descargar PNG
                    </button>
                </div>
            </div>

            <!-- ReportPreview inyecta aquí el reporte -->
            <div class="preview-wrap" id="previewHtml"></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <div id="app-footer"></div>

    <script type="module" src="./js/AppBlindado.js"></script>
</body>

</html>
